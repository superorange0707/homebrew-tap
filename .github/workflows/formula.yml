name: Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          brew tap superorange0707/tap "$GITHUB_WORKSPACE"
          brew trust --formula superorange0707/tap/project-brain
      - name: Install formula
        run: brew install project-brain
      - name: Test installed command
        run: |
          brew test project-brain
          brain --version
          codebase-memory-mcp --version
          test -x "$(command -v zoekt)"
          zoekt-index -h >/dev/null
