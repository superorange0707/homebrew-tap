name: Cask

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          brew tap superorange0707/tap "$GITHUB_WORKSPACE"
          brew trust superorange0707/tap
      - name: Install cask
        run: brew install --cask project-brain
      - name: Test installed command
        run: |
          brain --version
          codebase-memory-mcp --version
