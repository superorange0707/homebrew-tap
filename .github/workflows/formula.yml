name: Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Tap this checkout
        run: |
          brew tap superorange0707/tap "$GITHUB_WORKSPACE"
          brew trust --formula superorange0707/tap/project-brain
      - name: Install formula for bottle packaging
        run: brew install --build-bottle project-brain
      - name: Test installed command
        run: |
          brew test project-brain
          brain --version
          codebase-memory-mcp --version
      - name: Build Homebrew bottle
        run: brew bottle --json --root-url="https://github.com/superorange0707/homebrew-tap/releases/download/project-brain-0.2.0" project-brain
      - uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.*
          if-no-files-found: error
